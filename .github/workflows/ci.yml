name: CI — Lint, Build, Test & Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Secret Scanning
  secrets:
    name: Secret Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install Root Dependencies
        run: npm ci

      - name: Run SecretLint
        run: npx secretlint "**/*"

  # Job 2: Monorepo Build, Lint & Tests
  monorepo:
    name: Monorepo — Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: mane_bazar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/mane_bazar_test?schema=public

      - name: Lint All Workspaces (TypeScript check)
        run: npm run lint

      - name: Build All Workspaces (Shared, Database, Backend, Frontend)
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/mane_bazar_test?schema=public
          VITE_API_URL: http://localhost:4000/api
          VITE_RAZORPAY_KEY_ID: rzp_test_mock_for_ci
          VITE_GOOGLE_CLIENT_ID: mock-client-id.apps.googleusercontent.com

      - name: Run Test Suite
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:password123@localhost:5432/mane_bazar_test?schema=public
          JWT_SECRET: ci-test-secret-min-32-chars-long-here!
          JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long!

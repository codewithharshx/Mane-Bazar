name: CI — Lint, Test, Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Job 1: Secret Scanning
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run SecretLint
        uses: secretlint/secretlint-action@v0.2.0
        with:
          secretlintrcjson: .secretlintrc.json

  # Job 2: Client (Frontend) Build & Validation
  client:
    name: Client — Lint & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Verify Client Modules & Lint
        working-directory: client
        run: npm run lint

      - name: Build Production Bundle
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api
          VITE_RAZORPAY_KEY_ID: rzp_test_mock_key_for_ci
          VITE_GOOGLE_CLIENT_ID: mock-client-id.apps.googleusercontent.com

  # Job 3: Server (Backend) Tests & Integrity
  server:
    name: Server — Test Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Run Backend Automated Tests
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/mane-bazar-test
          MONGODB_MEMORY_SERVER: false
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long-value!!
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-min-32-chars-long-value!!
          RAZORPAY_KEY_ID: rzp_test_mock_key_for_ci
          RAZORPAY_KEY_SECRET: mock_secret_value_for_ci_testing_only
          RAZORPAY_WEBHOOK_SECRET: mock_webhook_secret_for_ci_testing_only

  # Job 4: Pipeline Summary
  quality:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [secrets, client, server]
    if: always()
    steps:
      - name: Report Status
        run: |
          echo "=============================================="
          echo "          Mane Bazar CI Pipeline Status       "
          echo "=============================================="
          echo "✅ Secret Scanning Passed"
          echo "✅ Frontend Validation & Production Build Passed"
          echo "✅ Backend Test Suite Passed Across Node 18 & 20"
          echo "=============================================="

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Warm Teak & Heritage Mahogany -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#422216"/>
      <stop offset="35%" stop-color="#2c140d"/>
      <stop offset="70%" stop-color="#3b1b11"/>
      <stop offset="100%" stop-color="#1f0c07"/>
    </linearGradient>

    <!-- Woodgrain horizontal plank effect -->
    <linearGradient id="plankHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Golden Architectural Border -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- 3D Letter Drop Shadows & Glow -->
    <filter id="monogramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#fef08a" flood-opacity="0.3"/>
    </filter>

    <filter id="ribbonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Saffron Wave -->
    <linearGradient id="saffronWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Emerald Green Wave -->
    <linearGradient id="greenWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Polished Letter Face -->
    <linearGradient id="letterFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Base Badge with Rounded Corners -->
  <rect width="512" height="512" rx="64" fill="url(#woodGradient)"/>
  
  <!-- Subtle Wood Slat Lines -->
  <line x1="32" y1="120" x2="480" y2="120" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="210" x2="480" y2="210" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="300" x2="480" y2="300" stroke="#000000" stroke-width="2" opacity="0.4"/>
  <line x1="32" y1="390" x2="480" y2="390" stroke="#000000" stroke-width="2" opacity="0.4"/>

  <!-- Golden Outer Fillet Inset -->
  <rect x="24" y="24" width="464" height="464" rx="48" fill="none" stroke="url(#goldBorder)" stroke-width="4" stroke-opacity="0.85"/>
  <rect x="30" y="30" width="452" height="452" rx="42" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- ================================================================= -->
  <!-- "MB" SERIF MONOGRAM (Faithfully modeled from physical signage)     -->
  <!-- ================================================================= -->
  <g filter="url(#monogramGlow)" transform="translate(256, 215)">
    <!-- 3D Extrusion Back Layer -->
    <text x="-124" y="24" 
          font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="168" 
          font-weight="900" 
          font-style="italic"
          fill="#180a06" 
          letter-spacing="-6px" 
          text-anchor="middle">M</text>
    <text x="76" y="24" 
          font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="168" 
          font-weight="900" 
          font-style="italic"
          fill="#180a06" 
          letter-spacing="-2px" 
          text-anchor="middle">B</text>

    <!-- Side bevel / warm ambient glow -->
    <text x="-121" y="21" 
          font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="168" 
          font-weight="900" 
          font-style="italic"
          fill="#b45309" 
          letter-spacing="-6px" 
          text-anchor="middle">M</text>
    <text x="79" y="21" 
          font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="168" 
          font-weight="900" 
          font-style="italic"
          fill="#b45309" 
          letter-spacing="-2px" 
          text-anchor="middle">B</text>

    <!-- Primary Front Face - Crisp White Letters -->
    <text x="-120" y="18" 
          font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="168" 
          font-weight="900" 
          font-style="italic"
          fill="url(#letterFace)" 
          stroke="#ffffff" 
          stroke-width="2" 
          letter-spacing="-6px" 
          text-anchor="middle">M</text>
    <text x="80" y="18" 
          font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="168" 
          font-weight="900" 
          font-style="italic"
          fill="url(#letterFace)" 
          stroke="#ffffff" 
          stroke-width="2" 
          letter-spacing="-2px" 
          text-anchor="middle">B</text>
  </g>

  <!-- ================================================================= -->
  <!-- DYNAMIC TRICOLOR RIBBON SWOOSH (From the physical store board)    -->
  <!-- ================================================================= -->
  <g filter="url(#ribbonShadow)">
    <!-- Upper Saffron / Gold Ribbon Swirl -->
    <path d="M 96,285 C 160,265 210,320 280,310 C 350,300 400,265 428,272 C 400,285 350,315 280,324 C 210,332 160,280 96,285 Z" 
          fill="url(#saffronWave)"/>

    <!-- Crisp White Center Ribbon Stroke -->
    <path d="M 92,293 C 158,273 208,328 280,318 C 352,308 404,273 432,280 C 404,291 352,324 280,332 C 208,340 158,288 92,293 Z" 
          fill="#ffffff"/>

    <!-- Lower Emerald Green Ribbon Swirl -->
    <path d="M 88,301 C 156,281 206,336 280,326 C 354,316 408,281 436,288 C 406,303 354,336 280,344 C 206,352 156,296 88,301 Z" 
          fill="url(#greenWave)"/>
  </g>

  <!-- ================================================================= -->
  <!-- "SINCE 1984" HERITAGE INSCRIPTION                                -->
  <!-- ================================================================= -->
  <g transform="translate(256, 395)">
    <!-- Small star / diamond emblems -->
    <polygon points="-110,-4 -106,-8 -102,-4 -106,0" fill="#f59e0b"/>
    <polygon points="110,-4 114,-8 118,-4 114,0" fill="#f59e0b"/>

    <!-- Inscription Text -->
    <text x="0" y="0" 
          font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="24" 
          font-weight="700" 
          letter-spacing="9px" 
          fill="#fef08a" 
          text-anchor="middle"
          opacity="0.95">SINCE 1984</text>
    
    <!-- Subtitle: Kasegaon -->
    <text x="0" y="28" 
          font-family="'Inter', 'Segoe UI', sans-serif" 
          font-size="13" 
          font-weight="600" 
          letter-spacing="6px" 
          fill="#cbd5e1" 
          text-anchor="middle"
          opacity="0.75">KASEGAON</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Monogram Medallion Wood Gradient -->
    <linearGradient id="hdrWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1b11"/>
      <stop offset="50%" stop-color="#240f09"/>
      <stop offset="100%" stop-color="#140603"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="hdrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Saffron Ribbon Gradient -->
    <linearGradient id="hdrSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Green Ribbon Gradient -->
    <linearGradient id="hdrGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Red Acrylic Channel Letter 3D Glow (As seen on the illuminated physical board) -->
    <filter id="neonSignGlow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#7f1d1d" flood-opacity="0.5"/>
    </filter>

    <linearGradient id="redSignGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- ================================================================= -->
  <!-- LEFT EMBLEM: MB Monogram Medallion (From Upper Store Sign)        -->
  <!-- ================================================================= -->
  <g transform="translate(10, 10)">
    <!-- Medallion Background with Golden Rim -->
    <rect width="100" height="100" rx="22" fill="url(#hdrWood)" stroke="url(#hdrGold)" stroke-width="2.5"/>
    <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.15"/>

    <!-- Wood Plank Lines -->
    <line x1="6" y1="32" x2="94" y2="32" stroke="#000000" stroke-width="1" opacity="0.35"/>
    <line x1="6" y1="56" x2="94" y2="56" stroke="#000000" stroke-width="1" opacity="0.35"/>
    <line x1="6" y1="78" x2="94" y2="78" stroke="#000000" stroke-width="1" opacity="0.35"/>

    <!-- "MB" Serif Letters -->
    <g transform="translate(50, 48)">
      <!-- Drop Shadow -->
      <text x="-24" y="6" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="900" font-style="italic" fill="#0c0402" letter-spacing="-1px" text-anchor="middle">M</text>
      <text x="16" y="6" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="900" font-style="italic" fill="#0c0402" letter-spacing="-0.5px" text-anchor="middle">B</text>
      <!-- Face -->
      <text x="-24" y="4" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="900" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" letter-spacing="-1px" text-anchor="middle">M</text>
      <text x="16" y="4" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="900" font-style="italic" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" letter-spacing="-0.5px" text-anchor="middle">B</text>
    </g>

    <!-- Tricolor Ribbon Swirl -->
    <path d="M 16,61 C 28,57 40,68 54,66 C 68,64 78,57 84,58 C 78,61 68,67 54,69 C 40,71 28,60 16,61 Z" fill="url(#hdrSaffron)"/>
    <path d="M 15,63 C 28,59 40,70 54,68 C 68,66 79,59 85,60 C 79,63 68,69 54,71 C 40,73 28,62 15,63 Z" fill="#ffffff"/>
    <path d="M 14,65 C 27,61 40,72 54,70 C 68,68 80,61 86,62 C 80,65 68,71 54,73 C 40,75 27,64 14,65 Z" fill="url(#hdrGreen)"/>

    <!-- "Since 1984" Inscription -->
    <text x="50" y="88" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" letter-spacing="2.2px" fill="#fef08a" text-anchor="middle">SINCE 1984</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT TYPOGRAPHY: Bilingual Authentic Kirana Brand                -->
  <!-- ================================================================= -->
  <!-- 1. DEVANAGARI SIGNBOARD LETTERING (माने बाज़ार)                     -->
  <g filter="url(#neonSignGlow)" transform="translate(126, 44)">
    <text x="0" y="0" 
          font-family="'Noto Sans Devanagari', 'Yatra One', 'Tiro Devanagari Hindi', 'Rozha One', 'Kohinoor Devanagari', 'Arial Unicode MS', sans-serif" 
          font-size="36" 
          font-weight="900" 
          letter-spacing="0.5px" 
          fill="url(#redSignGradient)"
          stroke="#b91c1c"
          stroke-width="0.6">माने बाज़ार</text>
  </g>

  <!-- 2. ENGLISH CAPITAL WORDMARK (MANE BAZAR)                          -->
  <g transform="translate(128, 76)">
    <text x="0" y="0" 
          font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="22" 
          font-weight="900" 
          letter-spacing="1.5px" 
          fill="#0f172a">MANE BAZAR</text>
    
    <!-- Verified Kirana Badge -->
    <rect x="174" y="-15" width="88" height="18" rx="9" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="184" cy="-6" r="3" fill="#16a34a"/>
    <text x="192" y="-3" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#065f46" letter-spacing="0.5px">KASEGAON</text>
  </g>

  <!-- 3. HERITAGE & QUALITY TRUST LINE                                 -->
  <g transform="translate(128, 100)">
    <text x="0" y="0" 
          font-family="'Inter', sans-serif" 
          font-size="10.5" 
          font-weight="600" 
          letter-spacing="1.2px" 
          fill="#64748b">
      <tspan fill="#d97706" font-weight="800">★ 40 YEARS</tspan> OF TRUST • PURE GROCERY &amp; STAPLES
    </text>
  </g>
</svg>

<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border:1px solid #dbe4ef;border-radius:14px;overflow:hidden;">
            <tr>
              <td style="padding:20px 24px;background:#0f766e;color:#ffffff;">
                <h1 style="margin:0;font-size:22px;">Verify Your Email</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:24px;">
                <p style="margin:0 0 12px 0;">Hi {{name}},</p>
                <p style="margin:0 0 16px 0;line-height:1.6;">Use the OTP below to verify your account.</p>
                <div style="margin:0 0 16px 0;padding:12px 16px;background:#ecfeff;border:1px solid #99f6e4;border-radius:10px;display:inline-block;">
                  <span style="font-size:26px;letter-spacing:6px;font-weight:700;color:#0f766e;">{{otp}}</span>
                </div>
                <p style="margin:0 0 16px 0;line-height:1.6;">This OTP expires in <strong>{{expiresMinutes}} minutes</strong>.</p>
                <p style="margin:0;color:#64748b;font-size:13px;">If you did not create this account, ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Emerald & Forest Green Radial Gradient -->
    <radialGradient id="badgeBg" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- Warm Golden Yellow Architectural Border -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- 3D Shadow for Monogram -->
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#022c22" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Saffron Wave -->
    <linearGradient id="waveSaffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Emerald Wave -->
    <linearGradient id="waveGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Square Tile -->
  <rect width="512" height="512" rx="100" fill="url(#badgeBg)"/>
  
  <!-- Architectural Gold Border (From Physical Storefront Portal) -->
  <rect x="18" y="18" width="476" height="476" rx="84" fill="none" stroke="url(#goldRim)" stroke-width="12"/>
  <rect x="28" y="28" width="456" height="456" rx="76" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25"/>

  <!-- ================================================================= -->
  <!-- "MB" SERIF MONOGRAM (Faithfully modeled from physical signage)     -->
  <!-- ================================================================= -->
  <g filter="url(#crispShadow)">
    <!-- Letters M and B with bold serif elegance -->
    <text x="180" y="270" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="220" 
          font-weight="900" 
          font-style="italic"
          fill="#ffffff" 
          letter-spacing="-8px" 
          text-anchor="middle">M</text>
    <text x="330" y="270" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="220" 
          font-weight="900" 
          font-style="italic"
          fill="#ffffff" 
          letter-spacing="-2px" 
          text-anchor="middle">B</text>
  </g>

  <!-- ================================================================= -->
  <!-- TRICOLOR RIBBON SWOOSH UNDER THE LETTERS                          -->
  <!-- ================================================================= -->
  <g transform="translate(0, 10)">
    <!-- Upper Saffron Wave -->
    <path d="M 80,310 C 160,285 220,345 285,335 C 350,325 400,285 432,295 C 400,310 350,345 285,355 C 220,365 160,305 80,310 Z" 
          fill="url(#waveSaffron)"/>

    <!-- Middle White Accent -->
    <path d="M 76,320 C 158,295 218,355 285,345 C 352,335 404,295 436,305 C 404,320 352,355 285,365 C 218,375 158,315 76,320 Z" 
          fill="#ffffff"/>

    <!-- Lower Emerald Wave -->
    <path d="M 72,330 C 156,305 216,365 285,355 C 354,345 408,305 440,315 C 408,332 354,367 285,377 C 216,387 156,325 72,330 Z" 
          fill="url(#waveGreen)"/>
  </g>

  <!-- ================================================================= -->
  <!-- "SINCE 1984" HERITAGE INSCRIPTION                                -->
  <!-- ================================================================= -->
  <g transform="translate(256, 440)">
    <!-- Gold accent stars -->
    <circle cx="-135" cy="-8" r="4" fill="#fde047"/>
    <circle cx="135" cy="-8" r="4" fill="#fde047"/>

    <text x="0" y="0" 
          font-family="'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="12px" 
          fill="#fef08a" 
          text-anchor="middle">SINCE 1984</text>
    
    <text x="0" y="26" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="16" 
          font-weight="700" 
          letter-spacing="8px" 
          fill="#a7f3d0" 
          text-anchor="middle"
          opacity="0.9">KASEGAON</text>
  </g>
</svg>
